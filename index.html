<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BSL S-2 Tournament Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#EBF0E8;--surface:#F7F9F5;--stripe:#E4EBE1;--ink:#14251D;--muted:#566A5E;--line:#C4D1C7;
  --pitch:#1D6A43;--on-pitch:#fff;--pitch-soft:#D3E7D9;--warn-bg:#FBF0C4;--warn-fg:#4A3A00;--warn-line:#E0AE12;
  --red:#B3352C;--on-red:#fff;--display:'Big Shoulders Display','Arial Narrow',Arial,sans-serif;--body:'Instrument Sans',system-ui,sans-serif
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--paper:#0F1914;--surface:#15231B;--stripe:#1B2C22;--ink:#E7EFE8;--muted:#94A99B;--line:#2B4034;--pitch:#52C185;--on-pitch:#07150D;--pitch-soft:#1B3A29;--warn-bg:#3A3210;--warn-fg:#F6E3A0;--warn-line:#D9A912;--red:#EE7268;--on-red:#1E0806}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--body)}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
.wrap{width:min(1080px,100%);margin:auto;padding:0 1rem}
h1,h2,h3,p{margin:0}.muted{color:var(--muted)}.small{font-size:.84rem}
.top{padding:1.25rem 0 .7rem}
.title{width:100%;border:0;border-bottom:2px dashed transparent;background:transparent;color:var(--ink);font:800 clamp(2.35rem,9vw,4.75rem)/1 var(--display);padding:.1rem 0}
.title:focus,.title:hover{outline:none;border-bottom-color:var(--pitch)}
.tabbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:1.35rem;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;padding:.8rem 0 .6rem;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--pitch)}
main{padding-bottom:5rem}.view[hidden]{display:none}
:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
input,select,textarea{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:.58rem .65rem;min-height:2.55rem;max-width:100%}
input[type=number]{width:5.2rem}
textarea{width:100%;min-height:9rem;font-size:.84rem}
.btn{font-weight:700;padding:.58rem .9rem;border-radius:7px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;min-height:2.55rem}
.btn:hover{background:var(--stripe)}.btn.primary{background:var(--pitch);border-color:var(--pitch);color:var(--on-pitch)}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--on-red)}.btn.ghost{border-color:var(--line)}
.icon{width:2.35rem;height:2.35rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;display:grid;place-items:center;cursor:pointer}
.row-actions{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.9rem}.fld{display:flex;flex-direction:column;gap:.25rem;font-size:.82rem;font-weight:700;color:var(--muted)}
.panel{margin-top:1.4rem;border-top:2px solid var(--ink);padding-top:1rem}
.section-title{font:800 1.9rem/1 var(--display)}
.intro{margin-top:1.35rem;padding:1rem;border-left:4px solid var(--pitch);background:var(--pitch-soft)}
/* group tables */
.group{margin-top:2.2rem}.group h2{font:800 clamp(1.8rem,6vw,2.7rem)/1 var(--display);margin-bottom:.65rem}
.tbl-scroll{overflow:auto;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
table.st{width:100%;min-width:520px;border-collapse:collapse;font-variant-numeric:tabular-nums}
.st th{font-size:.75rem;color:var(--muted);padding:.5rem .55rem;text-align:right;background:var(--paper)}.st th.team{text-align:left;position:sticky;left:0}
.st td{padding:.6rem .55rem;text-align:right;white-space:nowrap;background:var(--surface)}.st tr:nth-child(even) td{background:var(--stripe)}
.st td.team{position:sticky;left:0;text-align:left;min-width:12rem}.is-q td.team{box-shadow:inset 4px 0 var(--pitch)}
.pos{display:inline-block;min-width:1.55rem;font:800 1.3rem/1 var(--display);color:var(--muted)}.is-q .pos{color:var(--pitch)}
.tname{font-weight:700}.pts{font:800 1.65rem/1 var(--display)}
.chip{margin-left:.45rem;padding:.06rem .35rem;border-radius:4px;font-size:.66rem;font-weight:800;background:var(--pitch-soft);color:var(--pitch)}
.key{margin-top:1.5rem;color:var(--muted);font-size:.82rem;max-width:70ch}.key p+p{margin-top:.3rem}
/* knockout */
.knockout{margin-top:2.5rem;border-top:2px solid var(--ink);padding-top:1rem}.bracket{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;align-items:start;margin-top:1rem}
.round h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.6rem}
.kmatch{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.75rem;margin-bottom:1rem;box-shadow:0 2px 0 color-mix(in srgb,var(--line) 55%,transparent)}
.kmatch-title{font-size:.72rem;font-weight:800;color:var(--pitch);text-transform:uppercase;margin-bottom:.45rem}
.kteams{font-weight:800;font-size:1rem}.kscore{font:800 1.8rem/1 var(--display);margin:.2rem 0}.kdetail{font-size:.78rem;color:var(--muted)}
.kactions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.55rem}.kstatus{font-size:.75rem;color:var(--muted);margin-top:.45rem}
.final-summary{margin-top:1.2rem;padding:1rem;background:var(--pitch-soft);border-left:4px solid var(--pitch)}
/* match entry */
.match-head{display:flex;gap:1rem;justify-content:space-between;align-items:end;flex-wrap:wrap}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:.9rem;align-items:end;margin-top:1rem}.board .fld select{width:100%}
.live{display:flex;align-items:center;gap:.45rem;font:800 clamp(2.8rem,10vw,4.3rem)/1 var(--display);padding:0 .25rem}.dash{color:var(--muted)}
.hint{margin-top:.5rem;color:var(--muted);font-size:.82rem}
.match-mode{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}.mode-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:.45rem .7rem;border-radius:999px;font-weight:700;cursor:pointer}.mode-btn.active{background:var(--pitch);border-color:var(--pitch);color:var(--on-pitch)}
.player-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1.2rem}
.team-card{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:.8rem}.team-card h3{font-size:1rem;margin-bottom:.65rem}
.stat-section{border-top:1px solid var(--line);padding-top:.7rem;margin-top:.7rem}.stat-section h4{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 .45rem}
.counter-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.45rem;align-items:center;margin-bottom:.45rem}
.counter-row .who{min-width:0}.counter-row select{width:100%}.counter{display:flex;align-items:center;gap:.25rem}.counter button{width:2.25rem;height:2.25rem;border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;font-weight:900}.counter input{width:3.1rem;text-align:center;min-height:2.25rem;padding:.35rem}
.add-player{margin-top:.35rem}
.match-list{margin-top:2.2rem;border-top:2px solid var(--ink);padding-top:1rem}.match-item{padding:.9rem 0;border-bottom:1px solid var(--line)}
.match-top{display:flex;gap:.7rem;align-items:baseline;flex-wrap:wrap}.mstage{font-size:.72rem;color:var(--pitch);font-weight:800}.mteams{font-weight:800}.mscore{font:800 1.55rem/1 var(--display);margin:0 .4rem}.mdetail{font-size:.8rem;color:var(--muted);margin-top:.25rem}.mact{display:flex;gap:.45rem;margin-top:.55rem}
/* players */
.lists{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.3rem;margin-top:1.2rem}.board-h{font:800 1.75rem/1 var(--display);border-top:2px solid var(--ink);padding-top:.7rem;margin-bottom:.35rem}
.pl-list{list-style:none;padding:0;margin:0}.pl{display:grid;grid-template-columns:2rem 1fr auto;gap:.4rem;align-items:center;padding:.55rem .45rem}.pl:nth-child(even){background:var(--stripe)}.rk{font:800 1.2rem/1 var(--display);color:var(--muted)}.pl:first-child .rk{color:var(--pitch)}.who b{display:block}.who small{color:var(--muted);font-size:.75rem}.num{font:800 1.75rem/1 var(--display)}
/* setup */
.setup-sec{margin-top:2rem;border-top:2px solid var(--ink);padding-top:1rem}.setup-grid{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:.8rem}.sgroup{margin-top:1.2rem;padding:.8rem 0 1rem;border-bottom:1px solid var(--line)}.sg-head{display:flex;gap:.5rem;align-items:center;margin-bottom:.65rem}.sg-head input{flex:1;font-weight:800}.srow{display:grid;grid-template-columns:1fr auto;gap:.45rem;margin-bottom:.45rem}.srow input{width:100%}.roster{margin:.55rem 0 .75rem;padding:.7rem;border:1px dashed var(--line);border-radius:8px}.roster-head{display:flex;justify-content:space-between;gap:.5rem;align-items:center}.roster-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem;margin-top:.55rem}.roster-row{display:grid;grid-template-columns:1fr auto;gap:.35rem}.roster-row input{width:100%;min-height:2.3rem}.msg{min-height:1.3rem;margin-top:.6rem;color:var(--pitch);font-weight:700;font-size:.85rem}
/* toast */
#toast{position:fixed;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));transform:translate(-50%,1rem);background:var(--ink);color:var(--paper);padding:.65rem 1rem;border-radius:8px;font-weight:700;font-size:.85rem;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){
  .wrap{padding:0 .8rem}.top{padding-top:1rem}.tabs{gap:1rem}.tab{font-size:.88rem}
  .bracket{grid-template-columns:1fr}.round{display:contents}.round h3{margin-top:1rem}
  .player-columns{grid-template-columns:1fr}.lists{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}.board .live{grid-column:1/-1;order:-1;justify-content:center}
  .match-head .fld{width:100%}.match-head .fld select{width:100%}
  .roster-list{grid-template-columns:1fr}.sg-head{align-items:stretch;flex-direction:column}.srow{grid-template-columns:1fr}
  .mact .btn,.row-actions .btn{flex:1 1 auto}
}
@media(max-width:430px){
  .title{font-size:2.2rem}.board{gap:.5rem}.live{font-size:3.1rem}
  .counter-row{grid-template-columns:1fr}.counter{justify-content:flex-end}.kmatch{padding:.65rem}
}
@media print{
  .tabbar,.row-actions,.mact,#toast,.match-mode{display:none!important}body{background:#fff;color:#000}.view[hidden]{display:none}
}
</style>
</head>
<body>
<header class="top"><div class="wrap"><input id="title" class="title" maxlength="80" aria-label="Tournament name" placeholder="Tournament name"></div></header>
<nav class="tabbar"><div class="wrap"><div class="tabs" role="tablist">
<button class="tab" data-tab="standings" aria-selected="true">Standings</button>
<button class="tab" data-tab="matches" aria-selected="false">Matches</button>
<button class="tab" data-tab="players" aria-selected="false">Achievements</button>
<button class="tab" data-tab="setup" aria-selected="false">Teams & players</button>
</div></div></nav>
<main class="wrap">
<section id="view-standings" class="view"></section>
<section id="view-matches" class="view" hidden><div id="matchForm" class="panel"></div><div id="matchList"></div></section>
<section id="view-players" class="view" hidden></section>
<section id="view-setup" class="view" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var KEY='bsl.s2.manager.v2';
var $=function(s,r){return(r||document).querySelector(s)}, $$=function(s,r){return[].slice.call((r||document).querySelectorAll(s))};
var uid=function(){return Math.random().toString(36).slice(2,10)}, esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var clean=function(s){return String(s||'').replace(/\s+/g,' ').trim()}, n=function(v,d){var x=parseInt(v,10);return isNaN(x)?d:x};
var toast=function(m){var e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(function(){e.classList.remove('show')},2300)};

function newGroup(name,teams){return{id:uid(),name:name,teams:teams.map(function(x){return{id:uid(),name:x,players:[]}})}}
function defaultState(){
  return {
    title:'Bongoshongho Super League S-2',
    settings:{win:3,draw:1,loss:0,qualify:2},
    groups:[
      newGroup('Group A',['Nadia Nawaabz','Hooghly Hunters','Kolkata Royals']),
      newGroup('Group B',['Falcons of North 24 Parganas','Bardhaman FC','North Bengal FC'])
    ],
    matches:[],manual:{},
    knockout:{
      semi1:{id:'semi1',stage:'Semifinal 1',home:null,away:null,goals:[],stats:[],winner:null,penalties:null},
      semi2:{id:'semi2',stage:'Semifinal 2',home:null,away:null,goals:[],stats:[],winner:null,penalties:null},
      final:{id:'final',stage:'Final',home:null,away:null,goals:[],stats:[],winner:null,penalties:null}
    }
  }
}
function normalize(o){
  var d=defaultState();
  if(!o||!Array.isArray(o.groups))throw Error('bad backup');
  var groups=o.groups.map(function(g){return{id:String(g.id||uid()),name:String(g.name||''),teams:(g.teams||[]).map(function(t){return{id:String(t.id||uid()),name:String(t.name||''),players:Array.isArray(t.players)?t.players.map(clean).filter(Boolean):[]}})}});
  var matches=(o.matches||[]).map(function(m){return{
    id:String(m.id||uid()),group:String(m.group||''),stage:m.stage||'Group Stage',home:String(m.home||''),away:String(m.away||''),
    goals:(m.goals||[]).map(goalNorm),stats:(m.stats||[]).map(statNorm),winner:m.winner||null,penalties:m.penalties||null,ts:+m.ts||Date.now()
  }});
  var ko=o.knockout||d.knockout;
  ['semi1','semi2','final'].forEach(function(k){if(!ko[k])ko[k]=d.knockout[k];ko[k].goals=(ko[k].goals||[]).map(goalNorm);ko[k].stats=(ko[k].stats||[]).map(statNorm)});
  return{title:typeof o.title==='string'?o.title:d.title,settings:Object.assign({},d.settings,o.settings||{}),groups:groups,matches:matches,manual:o.manual||{},knockout:ko}
}
function goalNorm(g){return{side:g.side==='away'?'away':'home',player:String(g.player||''),n:Math.max(1,n(g.n,1)),og:!!g.og}}
function statNorm(s){return{side:s.side==='away'?'away':'home',player:String(s.player||''),saves:Math.max(0,n(s.saves,0)),tackles:Math.max(0,n(s.tackles,0))}}
function load(){try{var x=localStorage.getItem(KEY);return x?normalize(JSON.parse(x)):defaultState()}catch(e){return defaultState()}}
var state=load(),tab='standings',draft=null,matchMode='group',matchFilter='all';

function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function team(id){for(var g of state.groups)for(var t of g.teams)if(t.id===id)return t;return null}
function tname(id){var t=team(id);return t?t.name||'(unnamed team)':'TBD'}
function gname(id){var g=state.groups.find(function(x){return x.id===id});return g?g.name:'Group Stage'}
function allTeams(){return state.groups.flatMap(function(g){return g.teams})}
function playersFor(id){var t=team(id);return t?t.players:[]}
function score(m){var h=0,a=0;(m.goals||[]).forEach(function(g){if(g.side==='home')h+=g.n;else a+=g.n});return[h,a]}
function statForMatch(m,side,key){var map={};(m.stats||[]).forEach(function(s){if(s.side!==side||!clean(s.player))return;var k=s.player.toLowerCase();map[k]=(map[k]||{name:s.player,n:0});map[k].n+=s[key]||0});return Object.values(map)}
function teamStats(ids,matches){
  var W=n(state.settings.win,3),D=n(state.settings.draw,1),L=n(state.settings.loss,0),s={};
  ids.forEach(function(id){s[id]={p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0}});
  matches.forEach(function(m){var H=s[m.home],A=s[m.away];if(!H||!A)return;var z=score(m),h=z[0],a=z[1];H.p++;A.p++;H.gf+=h;H.ga+=a;A.gf+=a;A.ga+=h;
    if(h>a){H.w++;A.l++;H.pts+=W;A.pts+=L}else if(a>h){A.w++;H.l++;A.pts+=W;H.pts+=L}else{H.d++;A.d++;H.pts+=D;A.pts+=D}});
  ids.forEach(function(id){s[id].gd=s[id].gf-s[id].ga});return s
}
function cmp(a,b){return(b.pts-a.pts)||(b.gd-a.gd)||(b.gf-a.gf)}
function rankGroup(g){
  var ids=g.teams.map(function(t){return t.id}),ms=state.matches.filter(function(m){return m.stage==='Group Stage'&&m.group===g.id}),s=teamStats(ids,ms);
  var arr=ids.slice().sort(function(a,b){return cmp(s[a],s[b])}), rows=[],i=0;
  while(i<arr.length){var j=i+1;while(j<arr.length&&cmp(s[arr[i]],s[arr[j]])===0)j++;var bucket=arr.slice(i,j);
    var manual=(state.manual[g.id]||{})[bucket.slice().sort().join('|')];
    if(manual&&manual.length===bucket.length)bucket=manual.slice();
    bucket.forEach(function(id,k){rows.push({id:id,s:s[id],manual:!!manual&&k>0})});i=j}
  return{rows:rows,hasMatches:ms.length>0}
}
/* knockout helpers */
function winnerOf(k){
  if(!k.home||!k.away||!k.winner)return null;
  return k.winner;
}
function koMatchList(){return['semi1','semi2','final'].map(function(k){return state.knockout[k]})}
function allMatches(){return state.matches.concat(koMatchList().filter(function(m){return m.home&&m.away}))}
function finalPlacements(){
  var k=state.knockout,f=k.final,s1=k.semi1,s2=k.semi2;
  if(!f.winner)return null;
  var runner=f.winner===f.home?f.away:f.home;
  var losers=[];
  if(s1.winner)losers.push(s1.winner===s1.home?s1.away:s1.home);
  if(s2.winner)losers.push(s2.winner===s2.home?s2.away:s2.home);
  return{champion:f.winner,runner:runner,semi:losers}
}
function qualified(){
  var out=[];
  state.groups.forEach(function(g){rankGroup(g).rows.slice(0,n(state.settings.qualify,2)).forEach(function(r){out.push(r.id)})});
  return out
}
function refreshBracket(){
  var q=qualified(),a=q[0],b=q[1],c=q[2],d=q[3],k=state.knockout;
  if(a&&b){k.semi1.home=a;k.semi1.away=d||null}
  if(c&&d){k.semi2.home=c;k.semi2.away=b||null}
  if(k.semi1.winner&&k.semi1.winner!==k.semi1.home&&k.semi1.winner!==k.semi1.away)k.semi1.winner=null;
  if(k.semi2.winner&&k.semi2.winner!==k.semi2.home&&k.semi2.winner!==k.semi2.away)k.semi2.winner=null;
  k.final.home=k.semi1.winner||null;k.final.away=k.semi2.winner||null;
  if(k.final.winner&&k.final.winner!==k.final.home&&k.final.winner!==k.final.away)k.final.winner=null;
}
function stageLabel(m){return m.stage==='Group Stage'?gname(m.group):m.stage}
/* aggregate achievements from group + knockout */
function aggregate(){
  var map={};
  allMatches().forEach(function(m){if(!m.home||!m.away)return;
    (m.goals||[]).forEach(function(g){if(!clean(g.player))return;var tid=g.og?(g.side==='home'?m.away:m.home):(g.side==='home'?m.home:m.away),key=tid+'|'+g.player.toLowerCase();
      if(!map[key])map[key]={team:tid,name:g.player,goals:0,og:0,saves:0,tackles:0};if(g.og)map[key].og+=g.n;else map[key].goals+=g.n});
    (m.stats||[]).forEach(function(s){if(!clean(s.player))return;var tid=s.side==='home'?m.home:m.away,key=tid+'|'+s.player.toLowerCase();
      if(!map[key])map[key]={team:tid,name:s.player,goals:0,og:0,saves:0,tackles:0};map[key].saves+=s.saves||0;map[key].tackles+=s.tackles||0})
  });return Object.values(map)
}
function ranked(arr,key){return arr.filter(function(x){return x[key]>0}).sort(function(a,b){return(b[key]-a[key])||a.name.localeCompare(b.name)})}
/* rendering */
function render(){
  refreshBracket();save();
  ({standings:renderStandings,matches:renderMatches,players:renderPlayers,setup:renderSetup})[tab]()
}
function setTab(t){tab=t;$$('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===t)});$$('.view').forEach(function(v){v.hidden=v.id!=='view-'+t});render();scrollTo(0,0)}
function renderStandings(){
  var h=$('#view-standings'),html='';
  if(!state.matches.length)html+='<div class="intro"><b>Group stage is ready.</b> Add results in Matches. The top '+n(state.settings.qualify,2)+' from each group automatically move to the semifinals.</div>';
  state.groups.forEach(function(g){var r=rankGroup(g);html+='<section class="group"><h2>'+esc(g.name)+'</h2><div class="tbl-scroll"><table class="st"><thead><tr><th class="team">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>';
    r.rows.forEach(function(x,i){var q=r.hasMatches&&i<n(state.settings.qualify,2);html+='<tr'+(q?' class="is-q"':'')+'><td class="team"><span class="pos">'+(i+1)+'</span><span class="tname">'+esc(tname(x.id))+'</span></td><td>'+x.s.p+'</td><td>'+x.s.w+'</td><td>'+x.s.d+'</td><td>'+x.s.l+'</td><td>'+x.s.gf+'</td><td>'+x.s.ga+'</td><td>'+((x.s.gd>0?'+':'')+x.s.gd)+'</td><td class="pts">'+x.s.pts+'</td></tr>'});
    html+='</tbody></table></div></section>'});
  html+='<div class="key"><p><b>Qualification:</b> top '+n(state.settings.qualify,2)+' from each group enter the semifinal bracket.</p><p>Points: win '+n(state.settings.win,3)+', draw '+n(state.settings.draw,1)+', loss '+n(state.settings.loss,0)+'. Ranking: points → goal difference → goals scored → head-to-head.</p></div>';
  html+=renderBracket();h.innerHTML=html
}
function koCard(k){
  var ready=k.home&&k.away,z=score(k),winner=k.winner;
  var details='';
  if(ready){var gs=['home','away'].map(function(side){return statForMatch(k,side,'saves')}).flat(),tk=['home','away'].map(function(side){return statForMatch(k,side,'tackles')}).flat();
    var goalLines=(k.goals||[]).map(function(g){return esc(g.player)+(g.og?' (OG)':'')+(g.n>1?' ×'+g.n:'')}).join(', ');
    if(goalLines)details+='<div class="kdetail">Goals: '+goalLines+'</div>';
    if(gs.length)details+='<div class="kdetail">Saves recorded: '+gs.reduce(function(a,x){return a+x.n},0)+'</div>';
    if(tk.length)details+='<div class="kdetail">Tackles recorded: '+tk.reduce(function(a,x){return a+x.n},0)+'</div>';
  }
  return '<article class="kmatch"><div class="kmatch-title">'+esc(k.stage)+'</div><div class="kteams">'+(k.home?esc(tname(k.home)):'TBD')+' <span class="muted">vs</span> '+(k.away?esc(tname(k.away)):'TBD')+'</div>'+
    (ready?'<div class="kscore">'+z[0]+' – '+z[1]+'</div>':'<div class="kstatus">Waiting for group-stage qualifiers / semifinal winners.</div>')+details+
    (winner?'<div class="kstatus"><b>Winner:</b> '+esc(tname(winner))+'</div>':'')+
    (ready?'<div class="kactions"><button class="btn ghost" data-act="edit-ko" data-id="'+k.id+'">Update match</button></div>':'')+'</article>'
}
function renderBracket(){
  var k=state.knockout,html='<section class="knockout"><h2 class="section-title">Knockout stage</h2><p class="hint">Semifinals are generated from the group standings. The final appears after both semifinal winners are selected.</p><div class="bracket"><div class="round"><h3>Semifinals</h3>'+koCard(k.semi1)+koCard(k.semi2)+'</div><div class="round"><h3>Final</h3>'+koCard(k.final)+'</div><div class="round"><h3>Final standings</h3>';
  var p=finalPlacements();
  if(p)html+='<div class="final-summary"><p><b>Champion</b><br>'+esc(tname(p.champion))+'</p><p style="margin-top:.65rem"><b>Runner-up</b><br>'+esc(tname(p.runner))+'</p><p style="margin-top:.65rem"><b>Semifinalists</b><br>'+p.semi.map(function(id){return esc(tname(id))}).join('<br>')+'</p></div>';
  else html+='<p class="muted">Complete both semifinals and the final to evaluate the final standings.</p>';
  return html+'</div></div></section>'
}
/* match entry */
function newMatchDraft(){
  var g=state.groups.find(function(x){return x.teams.length>=2});
  return{id:null,stage:'Group Stage',group:g?g.id:'',home:g&&g.teams[0]?g.teams[0].id:'',away:g&&g.teams[1]?g.teams[1].id:'',goals:[],stats:[],winner:null,penalties:null}
}
function koById(id){return state.knockout[id]}
function ensureDraft(){if(matchMode==='group'){if(!draft||draft.stage!=='Group Stage')draft=newMatchDraft()}else if(draft&&draft.stage==='Group Stage')draft=null}
function playerSelect(list,value,cls){
  return '<select class="'+(cls||'')+'"><option value="">Select player</option>'+list.map(function(p){return'<option value="'+esc(p)+'"'+(p===value?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'</select>'
}
function counterSection(side,key,label,m){
  var tid=side==='home'?m.home:m.away,players=playersFor(tid),items=[];
  if(key==='goals')items=(m.goals||[]).map(function(g,i){return{idx:i,player:g.player,n:g.n,og:g.og,side:g.side}}).filter(function(x){return x.side===side});
  else items=(m.stats||[]).map(function(s,i){return{idx:i,player:s.player,n:s[key]||0,side:s.side}}).filter(function(x){return x.side===side&&x.n>=0});
  var html='<div class="stat-section"><h4>'+label+'</h4>';
  if(!items.length)html+='<p class="muted small">No players added yet.</p>';
  items.forEach(function(x){
    html+='<div class="counter-row" data-kind="'+key+'" data-side="'+side+'" data-i="'+x.idx+'"><div class="who">';
    html+=playerSelect(players,x.player,'player-pick');
    if(key==='goals')html+='<label class="small muted"><input type="checkbox" class="og-pick" '+(x.og?'checked':'')+'> Own goal</label>';
    html+='</div><div class="counter"><button data-act="counter-minus" aria-label="Decrease">−</button><input type="number" min="0" value="'+x.n+'" data-f="counter"><button data-act="counter-plus" aria-label="Increase">+</button><button class="icon" data-act="remove-counter" aria-label="Remove">×</button></div></div>'
  });
  html+='<button class="btn ghost add-player" data-act="add-counter" data-side="'+side+'" data-kind="'+key+'">+ Add player</button></div>';return html
}
function renderMatchEditor(m){
  var g=state.groups.find(function(x){return x.id===m.group}),teams=g?g.teams:[];
  var h=teams.length?teams:allTeams(),sc=score(m);
  var html='<div class="match-head"><h2 class="section-title">'+(m.id?'Edit':'Record')+' '+esc(m.stage||'Group Stage')+'</h2>';
  if(m.stage==='Group Stage')html+='<label class="fld">Group<select data-f="group">'+state.groups.filter(function(x){return x.teams.length>=2}).map(function(x){return'<option value="'+x.id+'"'+(x.id===m.group?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select></label>';
  html+='</div><div class="board"><label class="fld">Home team<select data-f="home">'+h.map(function(t){return'<option value="'+t.id+'"'+(t.id===m.home?' selected':'')+'>'+esc(t.name)+'</option>'}).join('')+'</select></label><div class="live"><span id="liveH">'+sc[0]+'</span><span class="dash">–</span><span id="liveA">'+sc[1]+'</span></div><label class="fld">Away team<select data-f="away">'+h.map(function(t){return'<option value="'+t.id+'"'+(t.id===m.away?' selected':'')+'>'+esc(t.name)+'</option>'}).join('')+'</select></label></div>';
  html+='<p class="hint">During the match, use +/− to update counts. Player names come from the team roster, so you can update the same player quickly.</p><div class="player-columns">';
  ['home','away'].forEach(function(side){html+='<div class="team-card"><h3>'+esc(tname(side==='home'?m.home:m.away))+'</h3>'+counterSection(side,'goals','Goals',m)+counterSection(side,'saves','Saves',m)+counterSection(side,'tackles','Tackles won',m)+'</div>'});
  html+='</div>';
  if(m.stage!=='Group Stage'&&sc[0]===sc[1])html+='<div class="intro" style="margin-top:1rem"><b>Knockout match is tied.</b> Select the team advancing on penalties.</div><div class="setup-grid"><label class="fld">Advancing team<select data-f="winner"><option value="">Select winner</option><option value="'+m.home+'"'+(m.winner===m.home?' selected':'')+'>'+esc(tname(m.home))+'</option><option value="'+m.away+'"'+(m.winner===m.away?' selected':'')+'>'+esc(tname(m.away))+'</option></select></label><label class="fld">Penalty score (optional)<input type="text" data-f="penalties" value="'+esc(m.penalties||'')+'" placeholder="e.g. 4–3"></label></div>';
  else if(m.stage!=='Group Stage')html+='<div class="setup-grid"><label class="fld">Winner / advancing team<select data-f="winner"><option value="">Select winner</option><option value="'+m.home+'"'+(m.winner===m.home?' selected':'')+'>'+esc(tname(m.home))+'</option><option value="'+m.away+'"'+(m.winner===m.away?' selected':'')+'>'+esc(tname(m.away))+'</option></select></label></div>';
  html+='<p class="err" id="mfErr"></p><div class="row-actions"><button class="btn primary" data-act="save-match">'+(m.id?'Save changes':'Save match')+'</button>'+(m.id?'<button class="btn ghost" data-act="cancel-edit">Cancel</button>':'')+'</div>';
  return html
}
function renderMatches(){
  ensureDraft();var h=$('#matchForm');
  if(matchMode==='ko'){
    var k=state.knockout,html='<div class="intro"><b>Knockout stage.</b><p class="hint">Semifinals are created from the group standings. Tap Update match to record goals, saves, tackles and the advancing team.</p></div><div class="bracket" style="margin-top:1rem"><div class="round"><h3>Semifinals</h3>'+koCard(k.semi1)+koCard(k.semi2)+'</div><div class="round"><h3>Final</h3>'+koCard(k.final)+'</div></div>';
    if(draft&&draft.stage!=='Group Stage')html=renderMatchEditor(draft)+'<div style="margin-top:1rem">'+html+'</div>';
    h.innerHTML=html;
  }else{
    if(!state.groups.some(function(g){return g.teams.length>=2})){h.innerHTML='<p class="empty">Add at least two teams to a group first.</p>';return}
    h.innerHTML=renderMatchEditor(draft)
  }
  var mode='<div class="match-mode"><button class="mode-btn '+(matchMode==='group'?'active':'')+'" data-act="mode" data-mode="group">Group stage</button><button class="mode-btn '+(matchMode==='ko'?'active':'')+'" data-act="mode" data-mode="ko">Semifinals / Final</button></div>';
  h.insertAdjacentHTML('afterbegin',mode);renderMatchList()
}
function fmtPeople(m,key,side){
  var a=key==='goals'?(m.goals||[]).filter(function(x){return x.side===side&&clean(x.player)}).map(function(x){return esc(x.player)+(x.og?' (OG)':'')+(x.n>1?' ×'+x.n:'')}):statForMatch(m,side,key).map(function(x){return esc(x.name)+' ×'+x.n});
  return a.join(', ')
}
function renderMatchList(){
  var h=$('#matchList'),arr=allMatches().filter(function(m){return m.home&&m.away}).slice().sort(function(a,b){return(b.ts||0)-(a.ts||0)});
  if(matchFilter!=='all')arr=arr.filter(function(m){return m.group===matchFilter||m.id===matchFilter});
  var html='<div class="match-list"><div class="match-head"><h2 class="section-title">Recorded matches ('+arr.length+')</h2><label class="fld">Show<select id="matchFilter"><option value="all">All</option>'+state.groups.map(function(g){return'<option value="'+g.id+'"'+(matchFilter===g.id?' selected':'')+'>'+esc(g.name)+'</option>'}).join('')+'</select></label></div>';
  if(!arr.length)html+='<p class="empty">No matches recorded yet.</p>';
  arr.forEach(function(m){var z=score(m),lines='';
    var hg=fmtPeople(m,'goals','home'),ag=fmtPeople(m,'goals','away');if(hg)lines+='<div class="mdetail"><b>Goals:</b> '+hg+'</div>';if(ag)lines+='<div class="mdetail"><b>Goals:</b> '+ag+'</div>';
    ['saves','tackles'].forEach(function(key){var a=statForMatch(m,'home',key).concat(statForMatch(m,'away',key));if(a.length)lines+='<div class="mdetail"><b>'+key.charAt(0).toUpperCase()+key.slice(1)+':</b> '+a.map(function(x){return esc(x.name)+' ×'+x.n}).join(', ')+'</div>'});
    if(m.winner)lines+='<div class="mdetail"><b>Advancing:</b> '+esc(tname(m.winner))+(m.penalties?' (penalties '+esc(m.penalties)+')':'')+'</div>';
    html+='<article class="match-item"><div class="match-top"><span class="mstage">'+esc(stageLabel(m))+'</span><span class="mteams">'+esc(tname(m.home))+' <span class="mscore">'+z[0]+' – '+z[1]+'</span> '+esc(tname(m.away))+'</span></div>'+lines+'<div class="mact">';
    if(m.stage==='Group Stage')html+='<button class="btn ghost" data-act="edit-group-match" data-id="'+m.id+'">Edit</button><button class="btn ghost" data-act="delete-group-match" data-id="'+m.id+'">Delete</button>';
    else html+='<button class="btn ghost" data-act="edit-ko" data-id="'+m.id+'">Edit</button>';
    html+='</div></article>'
  });h.innerHTML=html+'</div>'
}
function renderPlayers(){
  var h=$('#view-players'),a=aggregate(),sets=[['Top scorers','goals'],['Keeper saves','saves'],['Tackles won','tackles']],html='<div class="intro"><b>Individual achievements</b><p class="hint">Totals include group-stage matches, both semifinals and the final. Final tournament standings are shown after the final is completed.</p></div><div class="lists">';
  sets.forEach(function(s){html+='<section><h2 class="board-h">'+s[0]+'</h2>';var rows=ranked(a,s[1]).slice(0,30);if(!rows.length)html+='<p class="empty">No '+s[0].toLowerCase()+' recorded yet.</p>';else html+='<ol class="pl-list">'+rows.map(function(x,i){return'<li class="pl"><span class="rk">'+(i+1)+'</span><span class="who"><b>'+esc(x.name)+'</b><small>'+esc(tname(x.team))+'</small></span><span class="num">'+x[s[1]]+'</span></li>'}).join('')+'</ol>';html+='</section>'});html+='</div>';
  var p=finalPlacements();if(p)html+='<section class="knockout"><h2 class="section-title">Final tournament standings</h2><div class="final-summary"><p><b>1. Champion:</b> '+esc(tname(p.champion))+'</p><p style="margin-top:.4rem"><b>2. Runner-up:</b> '+esc(tname(p.runner))+'</p><p style="margin-top:.4rem"><b>3–4. Semifinalists:</b> '+p.semi.map(function(id){return esc(tname(id))}).join(' &nbsp; • &nbsp; ')+'</p></div></section>';
  h.innerHTML=html
}

  var h=$('#view-setup'),st=state.settings,html='<section class="setup-sec"><h2 class="section-title">Scoring</h2><div class="setup-grid">'+[['win','Points for a win'],['draw','Points for a draw'],['loss','Points for a loss'],['qualify','Teams qualifying per group']].map(function(x){return'<label class="fld">'+x[1]+'<input type="number" min="0" data-s="'+x[0]+'" value="'+n(st[x[0]],0)+'"></label>'}).join('')+'</div></section><section class="setup-sec"><h2 class="section-title">Groups, teams & player rosters</h2><p class="hint">Add every player once here. During a match, their names will appear in the Goals, Saves and Tackles sections.</p>';

    g.teams.forEach(function(t){html+='<div class="srow"><input data-s="team-name" data-g="'+g.id+'" data-t="'+t.id+'" value="'+esc(t.name)+'"><button class="btn ghost" data-act="delete-team" data-g="'+g.id+'" data-t="'+t.id+'">Remove</button></div><div class="roster"><div class="roster-head"><b>'+esc(t.name)+' — players</b><button class="btn ghost" data-act="add-roster" data-g="'+g.id+'" data-t="'+t.id+'">+ Add player</button></div>';
      if(!t.players.length)html+='<p class="hint">No players added. Add the squad here for quick match entry.</p>';
      html+='<div class="roster-list">'+t.players.map(function(p,i){return'<div class="roster-row"><input data-s="player-name" data-g="'+g.id+'" data-t="'+t.id+'" data-i="'+i+'" value="'+esc(p)+'"><button class="icon" data-act="delete-roster" data-g="'+g.id+'" data-t="'+t.id+'" data-i="'+i+'">×</button></div>'}).join('')+'</div></div>'});
    html+='<button class="btn ghost" data-act="add-team" data-g="'+g.id+'">+ Add team</button></div>'});
  html+='<div class="row-actions"><button class="btn primary" data-act="add-group">+ Add group</button></div></section>';
  html+='<section class="setup-sec"><h2 class="section-title">Backup</h2><p class="hint">Data is stored in this browser. Copy the backup code if you want to move it to another device.</p><div class="row-actions"><button class="btn ghost" data-act="show-backup">Show backup code</button><button class="btn ghost" data-act="restore-backup">Restore backup</button><button class="btn danger" data-act="erase">Erase everything</button></div><textarea id="backupBox" placeholder="Backup JSON appears here"></textarea><p class="msg" id="setupMsg"></p></section>';
  h.innerHTML=html

/* actions */
function armed(btn,label,fn){if(btn.dataset.armed){fn();return}btn.dataset.armed='1';var old=btn.textContent;btn.textContent=label;btn.classList.add('danger');setTimeout(function(){if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.textContent=old;btn.classList.remove('danger')}},3000)}
function addCounter(kind,side){
  var m=draft;if(!m)return;
  if(kind==='goals')m.goals.push({side:side,player:playersFor(side==='home'?m.home:m.away)[0]||'',n:1,og:false});
  else m.stats.push({side:side,player:playersFor(side==='home'?m.home:m.away)[0]||'',saves:kind==='saves'?1:0,tackles:kind==='tackles'?1:0});
  renderMatches()
}
function saveEdited(m){
  if(!m.home||!m.away||m.home===m.away){toast('Select two different teams');return}
  m.goals=(m.goals||[]).filter(function(g){return g.player&&g.n>0}).map(goalNorm);
  m.stats=(m.stats||[]).filter(function(s){return s.player&&(s.saves>0||s.tackles>0)}).map(statNorm);
  if(m.stage!=='Group Stage'&&(!m.winner||[m.home,m.away].indexOf(m.winner)<0)){toast('Select the advancing team');return}
  m.ts=m.ts||Date.now();save();refreshBracket();render();toast('Match saved')
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var d=b.dataset;
  if(d.act==='mode'){matchMode=d.mode;if(d.mode==='group')draft=newMatchDraft();else draft=null;renderMatches();return}
  if(d.act==='add-counter'){addCounter(d.kind,d.side);return}
  if(d.act==='remove-counter'){var row=b.closest('.counter-row'),kind=row.dataset.kind,i=+row.dataset.i;if(kind==='goals')draft.goals.splice(i,1);else draft.stats.splice(i,1);renderMatches();return}
  if(d.act==='counter-plus'||d.act==='counter-minus'){var row=b.closest('.counter-row'),kind=row.dataset.kind,i=+row.dataset.i,delta=d.act==='counter-plus'?1:-1;if(kind==='goals')draft.goals[i].n=Math.max(0,draft.goals[i].n+delta);else draft.stats[i][kind]=Math.max(0,(draft.stats[i][kind]||0)+delta);renderMatches();return}
  if(d.act==='save-match'){saveEdited(draft);return}
  if(d.act==='cancel-edit'){draft=newMatchDraft();renderMatches();return}
  if(d.act==='edit-group-match'){var m=state.matches.find(function(x){return x.id===d.id});if(m){draft=JSON.parse(JSON.stringify(m));matchMode='group';renderMatches();$('#matchForm').scrollIntoView({behavior:'smooth',block:'start'})}return}
  if(d.act==='delete-group-match'){armed(b,'Tap again to delete',function(){state.matches=state.matches.filter(function(x){return x.id!==d.id});save();render();toast('Match deleted')});return}
  if(d.act==='edit-ko'){var k=koById(d.id);if(k){draft=k;matchMode='ko';setTab('matches')}return}
  if(d.act==='add-group'){var letter=String.fromCharCode(65+state.groups.length);state.groups.push(newGroup('Group '+letter,['Team '+letter+'1','Team '+letter+'2','Team '+letter+'3']));save();renderSetup();return}
  if(d.act==='delete-group'){armed(b,'Tap again to remove',function(){state.matches=state.matches.filter(function(m){return m.group!==d.g});state.groups=state.groups.filter(function(g){return g.id!==d.g});save();renderSetup()});return}
  if(d.act==='add-team'){var g=state.groups.find(function(x){return x.id===d.g});if(g){g.teams.push({id:uid(),name:'New Team',players:[]});save();renderSetup()}return}
  if(d.act==='delete-team'){armed(b,'Tap again to remove',function(){var g=state.groups.find(function(x){return x.id===d.g});if(g){g.teams=g.teams.filter(function(t){return t.id!==d.t});state.matches=state.matches.filter(function(m){return m.home!==d.t&&m.away!==d.t});save();renderSetup()}});return}
  if(d.act==='add-roster'){var g=state.groups.find(function(x){return x.id===d.g}),t=g&&g.teams.find(function(x){return x.id===d.t});if(t){t.players.push('New Player');save();renderSetup()}return}
  if(d.act==='delete-roster'){var g=state.groups.find(function(x){return x.id===d.g}),t=g&&g.teams.find(function(x){return x.id===d.t});if(t){t.players.splice(+d.i,1);save();renderSetup()}return}
  if(d.act==='show-backup'){$('#backupBox').value=JSON.stringify(state,null,2);$('#backupBox').select();toast('Backup code ready');return}
  if(d.act==='restore-backup'){armed(b,'Tap again to restore',function(){try{state=normalize(JSON.parse($('#backupBox').value));draft=null;save();$('#title').value=state.title;render();toast('Backup restored')}catch(x){$('#setupMsg').textContent='Invalid backup code'}});return}
  if(d.act==='erase'){armed(b,'Tap again to erase',function(){state=defaultState();draft=null;save();$('#title').value=state.title;render();toast('All data erased')});return}
  if(d.act==='goto'){setTab(d.tab)}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='title'){state.title=t.value;save();return}
  var s=t.dataset.s;if(s){if(['win','draw','loss','qualify'].indexOf(s)>=0)state.settings[s]=Math.max(0,n(t.value,0));
    else if(s==='group-name'){var g=state.groups.find(function(x){return x.id===t.dataset.g});if(g)g.name=t.value}
    else if(s==='team-name'){var g=state.groups.find(function(x){return x.id===t.dataset.g}),tm=g&&g.teams.find(function(x){return x.id===t.dataset.t});if(tm)tm.name=t.value}
    else if(s==='player-name'){var g=state.groups.find(function(x){return x.id===t.dataset.g}),tm=g&&g.teams.find(function(x){return x.id===t.dataset.t});if(tm)tm.players[+t.dataset.i]=t.value}
    save();return
  }
  if(t.closest('#matchForm')&&draft){
    var row=t.closest('.counter-row');if(!row)return;var kind=row.dataset.kind,i=+row.dataset.i;
    if(t.classList.contains('player-pick')){if(kind==='goals')draft.goals[i].player=t.value;else draft.stats[i].player=t.value}
    if(t.dataset.f==='counter'){var v=Math.max(0,n(t.value,0));if(kind==='goals')draft.goals[i].n=v;else draft.stats[i][kind]=v}
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='matchFilter'){matchFilter=t.value;renderMatchList();return}
  if(!draft||!t.closest('#matchForm'))return;
  var f=t.dataset.f;
  if(f==='group'){draft.group=t.value;var g=state.groups.find(function(x){return x.id===draft.group});draft.home=g.teams[0].id;draft.away=g.teams[1].id;draft.goals=[];draft.stats=[];renderMatches()}
  else if(f==='home'||f==='away'){draft[f]=t.value;renderMatches()}
  else if(f==='winner'){draft.winner=t.value;save()}
  else if(f==='penalties'){draft.penalties=t.value;save()}
  else if(t.classList.contains('og-pick')){var row=t.closest('.counter-row'),i=+row.dataset.i;draft.goals[i].og=t.checked}
});
$$('.tab').forEach(function(b){b.addEventListener('click',function(){setTab(b.dataset.tab)})});
$('#title').value=state.title;render();
})();
</script>
</body>
</html>
