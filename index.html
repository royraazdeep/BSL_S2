<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football points table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#EBF0E8; --surface:#F7F9F5; --stripe:#E4EBE1; --ink:#14251D; --muted:#566A5E; --line:#C4D1C7;
  --pitch:#1D6A43; --on-pitch:#FFFFFF; --pitch-soft:#D3E7D9;
  --warn-bg:#FBF0C4; --warn-fg:#4A3A00; --warn-line:#E0AE12;
  --red:#B3352C; --on-red:#FFFFFF;
  --display:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1914; --surface:#15231B; --stripe:#1B2C22; --ink:#E7EFE8; --muted:#94A99B; --line:#2B4034;
    --pitch:#52C185; --on-pitch:#07150D; --pitch-soft:#1B3A29;
    --warn-bg:#3A3210; --warn-fg:#F6E3A0; --warn-line:#D9A912;
    --red:#EE7268; --on-red:#1E0806;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1914; --surface:#15231B; --stripe:#1B2C22; --ink:#E7EFE8; --muted:#94A99B; --line:#2B4034;
  --pitch:#52C185; --on-pitch:#07150D; --pitch-soft:#1B3A29;
  --warn-bg:#3A3210; --warn-fg:#F6E3A0; --warn-line:#D9A912;
  --red:#EE7268; --on-red:#1E0806;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--body)}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.25rem}
h2,h3,h4,p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
 
/* header + tabs */
.top{padding:2rem 0 .75rem}
.title{display:block;width:100%;border:0;border-bottom:2px dashed transparent;background:transparent;color:var(--ink);
  font:800 clamp(2.4rem,8vw,4.75rem)/1 var(--display);padding:.15rem 0;letter-spacing:.005em;border-radius:0}
.title:hover{border-bottom-color:var(--line)}
.title:focus{outline:none;border-bottom-color:var(--pitch)}
.tabbar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:1.75rem;overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);
  font:600 1rem var(--body);padding:.85rem 0 .65rem;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pitch)}
main{padding-bottom:5rem}
.view[hidden]{display:none}
 
/* controls */
:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.5rem .65rem;min-height:2.5rem;max-width:100%}
input[type=number]{width:5rem}
textarea{width:100%;min-height:8rem;font-size:.85rem}
.btn{font:600 .95rem var(--body);padding:.55rem 1rem;border-radius:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;min-height:2.5rem}
.btn:hover{background:var(--stripe)}
.btn.primary{background:var(--pitch);border-color:var(--pitch);color:var(--on-pitch)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--line)}
.btn.danger,.btn.danger:hover{background:var(--red);border-color:var(--red);color:var(--on-red)}
.icon{width:2.25rem;height:2.25rem;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer;padding:0}
.icon:hover:not(:disabled){background:var(--stripe)}
.icon:disabled{opacity:.35;cursor:default}
.row-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.fld{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;font-weight:600;color:var(--muted)}
.fld select,.fld input{font-weight:400;color:var(--ink)}
 
/* standings */
.intro{margin-top:1.75rem;padding:1rem 1.1rem;border-left:4px solid var(--pitch);background:var(--pitch-soft)}
.group{margin-top:2.5rem}
.group h2{font:800 clamp(1.9rem,5vw,2.8rem)/1 var(--display);margin-bottom:.7rem}
.tbl-scroll{overflow-x:auto;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
table.st{width:100%;border-collapse:collapse;min-width:540px;font-variant-numeric:tabular-nums}
.st th{font-weight:600;font-size:.8rem;color:var(--muted);text-align:right;padding:.55rem .65rem;background:var(--paper)}
.st th.team{text-align:left;position:sticky;left:0;background:var(--paper)}
.st tbody tr{background:var(--surface)}
.st tbody tr:nth-child(even){background:var(--stripe)}
.st td{padding:.65rem .65rem;text-align:right;white-space:nowrap}
.st td.team{text-align:left;position:sticky;left:0;background:inherit;min-width:12rem}
.is-q td.team{box-shadow:inset 4px 0 0 var(--pitch)}
.pos{display:inline-block;min-width:1.7rem;font:800 1.35rem/1 var(--display);color:var(--muted);vertical-align:middle}
.is-q .pos{color:var(--pitch)}
.tname{font-weight:600;vertical-align:middle}
.st td.pts{font:800 1.75rem/1 var(--display);color:var(--ink)}
.chip{display:inline-block;margin-left:.55rem;padding:.05rem .4rem;border-radius:3px;font-size:.7rem;font-weight:700;background:var(--pitch-soft);color:var(--pitch);vertical-align:middle}
.chip.warn{background:var(--warn-bg);color:var(--warn-fg);box-shadow:inset 0 0 0 1px var(--warn-line)}
.key{margin-top:2.5rem;font-size:.85rem;color:var(--muted);max-width:70ch}
.key p+p{margin-top:.35rem}
.tie{margin-top:.85rem;padding:.85rem 1rem;border-left:4px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-fg);max-width:46rem}
.tie.done{border-left-color:var(--pitch);background:var(--pitch-soft);color:var(--ink)}
.tie ol{margin:.6rem 0;padding-left:1.4rem}
.tie li{padding:.2rem 0}
.tie li .li-in{display:inline-flex;align-items:center;gap:.5rem}
.tie li .tname{min-width:8rem;display:inline-block}
.tie .icon{color:var(--ink)}
 
/* matches */
.panel{margin-top:1.75rem;border-top:2px solid var(--ink);padding-top:1rem}
.mf-head{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between}
.mf-head h2,.sect-h{font:800 1.9rem/1 var(--display)}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:end;margin-top:1.25rem}
.board .fld select{width:100%}
.live{display:flex;align-items:center;gap:.6rem;font:800 clamp(3rem,10vw,4.5rem)/1 var(--display);padding:0 .25rem}
.live .dash{color:var(--muted)}
.hint{margin-top:.6rem;font-size:.875rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem 2rem;margin-top:1.25rem}
.col h3,.sub-h{font:600 1rem var(--body);margin-bottom:.6rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.55rem}
.row .in-player{flex:1 1 9rem;min-width:0}
.row .in-n{width:4.25rem}
.og{display:inline-flex;align-items:center;gap:.35rem;font-size:.85rem;color:var(--muted);white-space:nowrap}
.og input{min-height:auto;width:1.05rem;height:1.05rem;accent-color:var(--pitch)}
.row.stat select{flex:0 1 9rem}
.num-fld{display:flex;flex-direction:column;font-size:.75rem;font-weight:600;color:var(--muted);gap:.15rem}
.num-fld input{width:5.5rem}
.sect{margin-top:1.75rem}
.err{min-height:1.4rem;margin-top:.75rem;color:var(--red);font-weight:600;font-size:.9rem}
.list-head{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between;margin-top:3rem;border-top:2px solid var(--ink);padding-top:1rem}
.match{padding:.9rem 0;border-bottom:1px solid var(--line)}
.match-top{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:baseline}
.mgroup{font-size:.8rem;font-weight:700;color:var(--pitch);min-width:5.5rem}
.mteams{font-weight:600;font-size:1.05rem}
.ms{font:800 1.6rem/1 var(--display);margin:0 .5rem;vertical-align:middle}
.mdetail{font-size:.9rem;color:var(--muted);margin-top:.25rem}
.mdetail b{color:var(--ink);font-weight:600}
.mact{display:flex;gap:.5rem;margin-top:.6rem}
.mact .btn{min-height:2.1rem;padding:.25rem .8rem;font-size:.85rem}
.empty{margin-top:1.5rem;color:var(--muted)}
 
/* players */
.filter-bar{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between;margin-top:1.75rem}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:2.25rem 2.5rem;margin-top:1.25rem}
.board-h{font:800 1.9rem/1 var(--display);border-top:2px solid var(--ink);padding-top:.75rem;margin-bottom:.35rem}
.pl-list{list-style:none;margin:0;padding:0}
.pl{display:grid;grid-template-columns:2rem 1fr auto;gap:.5rem;align-items:center;padding:.55rem .5rem;font-variant-numeric:tabular-nums}
.pl:nth-child(even){background:var(--stripe)}
.pl .rk{font:800 1.25rem/1 var(--display);color:var(--muted)}
.pl:nth-child(1) .rk{color:var(--pitch)}
.pl .who b{display:block;font-weight:600;line-height:1.25}
.pl .who small{color:var(--muted);font-size:.8rem}
.pl .num{font:800 1.9rem/1 var(--display)}
.og-note{margin-top:.6rem;font-size:.8rem;color:var(--muted)}
 
/* setup */
.setup-sec{margin-top:2.25rem;border-top:2px solid var(--ink);padding-top:1rem}
.setup-grid{display:flex;flex-wrap:wrap;gap:1rem;margin-top:.9rem}
.sgroup{margin-top:1.25rem;padding:.9rem 0 1rem;border-bottom:1px solid var(--line)}
.sg-head{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.7rem}
.sg-head input{font-weight:700;font-size:1.05rem;flex:1 1 12rem}
.srow{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem;max-width:32rem}
.srow input{flex:1}
.srow .btn{min-height:2.5rem;padding:.3rem .8rem;font-size:.85rem}
.msg{min-height:1.4rem;margin-top:.75rem;font-size:.9rem;font-weight:600;color:var(--pitch)}
 
#toast{position:fixed;left:50%;bottom:1.25rem;transform:translate(-50%,1rem);background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:6px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
 
@media (max-width:640px){
  .board{grid-template-columns:1fr 1fr}
  .board .live{grid-column:1 / -1;order:-1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  .tabbar,.tie .icon,.intro,.row-actions,#toast{display:none!important}
  body{background:#fff;color:#000}
  .view[hidden]{display:none}
  .st tbody tr,.st tbody tr:nth-child(even){background:#fff}
  .tbl-scroll{overflow:visible}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <input id="title" class="title" type="text" maxlength="80" placeholder="Tournament name" aria-label="Tournament name (click to rename)">
</div></header>
<nav class="tabbar" aria-label="Sections"><div class="wrap"><div class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="standings" aria-selected="true">Standings</button>
  <button class="tab" role="tab" data-tab="matches" aria-selected="false">Matches</button>
  <button class="tab" role="tab" data-tab="players" aria-selected="false">Players</button>
  <button class="tab" role="tab" data-tab="setup" aria-selected="false">Teams and rules</button>
</div></div></nav>
<main class="wrap">
  <section id="view-standings" class="view" role="tabpanel"></section>
  <section id="view-matches" class="view" role="tabpanel" hidden>
    <div id="matchForm" class="panel"></div>
    <div id="matchList"></div>
  </section>
  <section id="view-players" class="view" role="tabpanel" hidden></section>
  <section id="view-setup" class="view" role="tabpanel" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
 
<script>
(function(){
'use strict';
 
/* ---------- helpers ---------- */
var KEY = 'matchday.pointsTable.v1';
var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var uid = function(){ return Math.random().toString(36).slice(2, 9); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var clean = function(s){ return String(s || '').replace(/\s+/g, ' ').trim(); };
var num = function(v, d){ var n = parseInt(v, 10); return isNaN(n) ? d : n; };
var joinNames = function(a){ return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; };
 
var UP = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 9l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var DOWN = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var XICON = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
 
/* ---------- state ---------- */
function defaultState(){
  var mk = function(letter){
    return { id: uid(), name: 'Group ' + letter, teams: [1,2,3,4].map(function(n){ return { id: uid(), name: 'Team ' + letter + n }; }) };
  };
  return { title: 'Football tournament', settings: { win: 3, draw: 1, loss: 0, qualify: 2 }, groups: [mk('A'), mk('B')], matches: [], manual: {} };
}
function normalize(o){
  if (!o || !Array.isArray(o.groups) || !Array.isArray(o.matches)) throw new Error('bad backup');
  var d = defaultState(), st = o.settings || {};
  return {
    title: typeof o.title === 'string' ? o.title : d.title,
    settings: { win: num(st.win, 3), draw: num(st.draw, 1), loss: num(st.loss, 0), qualify: num(st.qualify, 2) },
    groups: o.groups.map(function(g){ return { id: String(g.id), name: String(g.name || ''), teams: (g.teams || []).map(function(t){ return { id: String(t.id), name: String(t.name || '') }; }) }; }),
    matches: o.matches.map(function(m){ return {
      id: String(m.id || uid()), group: String(m.group), home: String(m.home), away: String(m.away),
      goals: (m.goals || []).map(function(g){ return { side: g.side === 'away' ? 'away' : 'home', player: String(g.player || ''), n: Math.max(1, num(g.n, 1)), og: !!g.og }; }),
      stats: (m.stats || []).map(function(s){ return { side: s.side === 'away' ? 'away' : 'home', player: String(s.player || ''), saves: Math.max(0, num(s.saves, 0)), tackles: Math.max(0, num(s.tackles, 0)) }; }),
      ts: +m.ts || Date.now() }; }),
    manual: (o.manual && typeof o.manual === 'object') ? o.manual : {}
  };
}
function load(){
  try { var raw = localStorage.getItem(KEY); if (!raw) return null; return normalize(JSON.parse(raw)); } catch (e) { return null; }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
 
var state = load() || defaultState();
var tab = 'standings';
var matchFilter = 'all', playerFilter = 'all';
var draft = null;
 
/* ---------- lookups ---------- */
function tname(id){
  for (var i = 0; i < state.groups.length; i++) {
    var t = state.groups[i].teams.find(function(t){ return t.id === id; });
    if (t) return t.name || '(unnamed team)';
  }
  return '(removed team)';
}
function gname(id){ var g = state.groups.find(function(g){ return g.id === id; }); return g ? (g.name || 'Untitled group') : ''; }
 
/* ---------- table maths ---------- */
function score(m){
  var h = 0, a = 0;
  m.goals.forEach(function(g){ if (g.side === 'home') h += g.n; else a += g.n; });
  return [h, a];
}
function computeStats(ids, matches){
  var W = num(state.settings.win, 3), D = num(state.settings.draw, 1), L = num(state.settings.loss, 0);
  var s = {};
  ids.forEach(function(id){ s[id] = { id: id, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 }; });
  matches.forEach(function(m){
    var H = s[m.home], A = s[m.away]; if (!H || !A) return;
    var r = score(m), h = r[0], a = r[1];
    H.p++; A.p++; H.gf += h; H.ga += a; A.gf += a; A.ga += h;
    if (h > a) { H.w++; A.l++; H.pts += W; A.pts += L; }
    else if (h < a) { A.w++; H.l++; A.pts += W; H.pts += L; }
    else { H.d++; A.d++; H.pts += D; A.pts += D; }
  });
  ids.forEach(function(id){ s[id].gd = s[id].gf - s[id].ga; });
  return s;
}
function cmp(x, y){ return (y.pts - x.pts) || (y.gd - x.gd) || (y.gf - x.gf); }
 
/* Ranking order: points, goal difference, goals scored, head-to-head, then the organiser's own call. */
function rankGroup(group){
  var ids = group.teams.map(function(t){ return t.id; });
  var ms = state.matches.filter(function(m){ return m.group === group.id; });
  var stats = computeStats(ids, ms);
  var sorted = ids.slice().sort(function(a, b){ return cmp(stats[a], stats[b]); });
  var rows = [], tieSets = [], i = 0;
  while (i < sorted.length) {
    var j = i + 1;
    while (j < sorted.length && cmp(stats[sorted[i]], stats[sorted[j]]) === 0) j++;
    var bucket = sorted.slice(i, j), items;
    if (bucket.length === 1) items = [{ id: bucket[0], via: null }];
    else items = resolveTie(bucket, ms, group, stats, tieSets);
    if (rows.length) {
      var prev = stats[rows[rows.length - 1].id], cur = stats[items[0].id];
      items[0].via = prev.pts !== cur.pts ? null : (prev.gd !== cur.gd ? 'GD' : 'GF');
    }
    rows = rows.concat(items);
    i = j;
  }
  return { rows: rows.map(function(r){ return { id: r.id, via: r.via, s: stats[r.id] }; }), tieSets: tieSets, hasMatches: ms.length > 0 };
}
function resolveTie(set, ms, group, stats, tieSets){
  var inSet = {}; set.forEach(function(id){ inSet[id] = true; });
  var mini = computeStats(set, ms.filter(function(m){ return inSet[m.home] && inSet[m.away]; }));
  var ordered = set.slice().sort(function(a, b){ return cmp(mini[a], mini[b]); });
  var buckets = [];
  ordered.forEach(function(id){
    var last = buckets[buckets.length - 1];
    if (last && cmp(mini[last[0]], mini[id]) === 0) last.push(id); else buckets.push([id]);
  });
  if (buckets.length === 1) return manualOrder(set, group, stats, tieSets);
  var out = [];
  buckets.forEach(function(b, bi){
    var items = b.length === 1 ? [{ id: b[0], via: null }] : resolveTie(b, ms, group, stats, tieSets);
    if (bi > 0) items[0].via = 'H2H';
    out = out.concat(items);
  });
  return out;
}
function manualOrder(set, group, stats, tieSets){
  var sig = set.slice().sort().join('|');
  var saved = (state.manual[group.id] || {})[sig];
  var valid = Array.isArray(saved) && saved.length === set.length && set.every(function(id){ return saved.indexOf(id) > -1; });
  var order = valid ? saved.slice() : set.slice();
  var anyPlayed = set.some(function(id){ return stats[id].p > 0; });
  tieSets.push({ sig: sig, ids: order.slice(), decided: valid, show: anyPlayed });
  return order.map(function(id, i){ return { id: id, via: i === 0 ? null : (valid ? 'You' : (anyPlayed ? 'Tied' : null)) }; });
}
function getTie(gid, sig){
  var g = state.groups.find(function(x){ return x.id === gid; }); if (!g) return null;
  return rankGroup(g).tieSets.find(function(t){ return t.sig === sig; }) || null;
}
function setManual(gid, sig, arr){
  if (!state.manual[gid]) state.manual[gid] = {};
  if (arr) state.manual[gid][sig] = arr; else delete state.manual[gid][sig];
  save(); render();
}
 
/* ---------- player maths ---------- */
function playersByTeam(){
  var r = {};
  var add = function(team, name){
    name = clean(name); if (!name) return;
    if (!r[team]) r[team] = {};
    var k = name.toLowerCase(); if (!r[team][k]) r[team][k] = name;
  };
  state.matches.slice().sort(function(a, b){ return a.ts - b.ts; }).forEach(function(m){
    m.goals.forEach(function(g){
      var scoring = g.side === 'home' ? m.home : m.away, other = g.side === 'home' ? m.away : m.home;
      add(g.og ? other : scoring, g.player);
    });
    m.stats.forEach(function(s){ add(s.side === 'home' ? m.home : m.away, s.player); });
  });
  var out = {};
  Object.keys(r).forEach(function(t){ out[t] = Object.keys(r[t]).map(function(k){ return r[t][k]; }).sort(function(a, b){ return a.localeCompare(b); }); });
  return out;
}
function aggregate(filter){
  var map = {};

    name = clean(name); var k = team + '|' + name.toLowerCase();

    return map[k];
  };
  state.matches.slice().sort(function(a, b){ return a.ts - b.ts; }).forEach(function(m){
    if (filter !== 'all' && m.group !== filter) return;
    m.goals.forEach(function(g){
      if (!clean(g.player)) return;
      var scoring = g.side === 'home' ? m.home : m.away, other = g.side === 'home' ? m.away : m.home;
      if (g.og) get(other, g.player).og += g.n; else get(scoring, g.player).goals += g.n;
    });
    m.stats.forEach(function(s){
      if (!clean(s.player)) return;
      var p = get(s.side === 'home' ? m.home : m.away, s.player); p.saves += s.saves; p.tackles += s.tackles;
    });

  var r = 0, last = null;
  return rows.map(function(p, i){ if (p[key] !== last) { r = i + 1; last = p[key]; } return { name: p.name, team: p.team, n: p[key], rank: r }; });

function saveMatch(){

  var goals = draft.goals.filter(function(g){ return g.n >= 1; }).map(function(g){ return { side: g.side, player: clean(g.player), n: g.n, og: !!g.og }; });
  var stats = [];

    var s = draft.stats[i], p = clean(s.player);
    if (!p && (s.saves > 0 || s.tackles > 0)) return fail('One of the saves or tackles lines has no player name.');
    if (p && (s.saves > 0 || s.tackles > 0)) stats.push({ side: s.side, player: p, saves: s.saves, tackles: s.tackles });
  }
  var existing = draft.id ? state.matches.find(function(m){ return m.id === draft.id; }) : null;
  var m = { id: draft.id || uid(), group: draft.group, home: draft.home, away: draft.away, goals: goals, stats: stats, ts: existing ? existing.ts : Date.now() };
  if (existing) state.matches[state.matches.indexOf(existing)] = m; else state.matches.push(m);
  var sc = score(m), label = tname(m.home) + ' ' + sc[0] + '\u2013' + sc[1] + ' ' + tname(m.away);

    case 'add-goal': draft.goals.push({ side: d.side, player: '', n: 1, og: false }); renderForm(); focusLast('.row.goal[data-side="' + d.side + '"] [data-f="goal-player"]'); break;
    case 'del-goal': draft.goals.splice(+d.i, 1); renderForm(); break;
    case 'add-stat': draft.stats.push({ side: 'home', player: '', saves: 0, tackles: 0 }); renderForm(); focusLast('.row.stat [data-f="stat-player"]'); break;
    case 'del-stat': draft.stats.splice(+d.i, 1); renderForm(); break;
    case 'save-match': saveMatch(); break;
    case 'cancel-edit': draft = newDraft(draft.group); renderForm(); break;
    case 'edit-match': {
      var m = state.matches.find(function(x){ return x.id === d.id; }); if (!m) break;
      draft = JSON.parse(JSON.stringify(m)); renderForm();
      $('#matchForm').scrollIntoView({ block: 'start' }); break;
    }
    case 'del-match': armed(b, 'Tap again to delete', function(){
      state.matches = state.matches.filter(function(x){ return x.id !== d.id; });
      if (draft && draft.id === d.id) draft = newDraft(draft.group);
      save(); render(); toast('Result deleted');
    }); break;
 
    case 'add-group': {
      var letter = String.fromCharCode(65 + (state.groups.length % 26));
      state.groups.push({ id: uid(), name: 'Group ' + letter, teams: [1,2,3,4].map(function(n){ return { id: uid(), name: 'Team ' + letter + n }; }) });
      save(); renderSetup(); break;
    }
    case 'del-group': armed(b, 'Tap again to remove', function(){
      state.groups = state.groups.filter(function(g){ return g.id !== d.g; });
      state.matches = state.matches.filter(function(m){ return m.group !== d.g; });
      delete state.manual[d.g]; draft = null; save(); renderSetup();
    }); break;
    case 'add-team': {
      var g = state.groups.find(function(x){ return x.id === d.g; }); if (!g) break;
      g.teams.push({ id: uid(), name: 'Team ' + (g.teams.length + 1) }); save(); renderSetup(); break;
    }
    case 'del-team': armed(b, 'Tap again to remove', function(){
      var g = state.groups.find(function(x){ return x.id === d.g; }); if (!g) return;
      g.teams = g.teams.filter(function(t){ return t.id !== d.t; });
      state.matches = state.matches.filter(function(m){ return m.home !== d.t && m.away !== d.t; });
      draft = null; save(); renderSetup();
    }); break;
 
    case 'backup-show': {
      var box = $('#backupBox'); box.value = JSON.stringify(state, null, 2); box.focus(); box.select();
      var done = function(ok){ setMsg(ok ? 'Backup code copied. Paste it somewhere safe.' : 'Backup code is in the box. Select it all and copy it.'); };
      try { navigator.clipboard.writeText(box.value).then(function(){ done(true); }, function(){ done(false); }); } catch (err) { done(false); }
      break;
    }
    case 'backup-download': {
      if (!downloadsApi) break;
      downloadsApi.save({ filename: 'points-table-backup.json', data: JSON.stringify(state, null, 2) })
        .then(function(){ setMsg('Backup saved.'); }, function(er){ setMsg(er && er.code === 'declined' ? 'Download cancelled.' : 'Could not save a file here. Use Show backup code instead.'); });
      break;
    }
    case 'restore': armed(b, 'Tap again to replace current data', function(){
      try {
        var next = normalize(JSON.parse($('#backupBox').value));
        state = next; draft = null; save(); $('#title').value = state.title; renderSetup(); setMsg('Restored ' + state.matches.length + ' results.');
      } catch (er) { setMsg('That is not a backup from this tool. Paste the full code and try again.'); }
    }); break;
    case 'sample': armed(b, 'Tap again to replace current data', function(){
      state = sampleState(); draft = null; save(); $('#title').value = state.title; render(); toast('Sample tournament loaded');
    }); break;
    case 'erase': armed(b, 'Tap again to erase all data', function(){
      state = defaultState(); draft = null; save(); $('#title').value = state.title; renderSetup(); setMsg('Everything erased.');
    }); break;
  }
});
 
function formInput(t){
  var f = t.dataset.f; if (!f) return;
  var row = t.closest('.row'), i = row ? +row.dataset.i : -1;
  if (f === 'goal-player') draft.goals[i].player = t.value;
  else if (f === 'goal-n') { draft.goals[i].n = Math.max(0, num(t.value, 0)); updateLive(); }
  else if (f === 'stat-player') draft.stats[i].player = t.value;
  else if (f === 'stat-saves') draft.stats[i].saves = Math.max(0, num(t.value, 0));
  else if (f === 'stat-tackles') draft.stats[i].tackles = Math.max(0, num(t.value, 0));
}
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.id === 'title') { state.title = t.value; save(); return; }
  if (t.closest('#matchForm')) { formInput(t); return; }
  var s = t.dataset.s; if (!s) return;
  if (s === 'win' || s === 'draw' || s === 'loss' || s === 'qualify') state.settings[s] = Math.max(0, num(t.value, 0));
  else if (s === 'group-name') { var g = state.groups.find(function(x){ return x.id === t.dataset.g; }); if (g) g.name = t.value; }
  else if (s === 'team-name') {
    var g2 = state.groups.find(function(x){ return x.id === t.dataset.g; });
    var tm = g2 && g2.teams.find(function(x){ return x.id === t.dataset.t; }); if (tm) tm.name = t.value;
  }
  save();
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.id === 'matchFilter') { matchFilter = t.value; renderMatchList(); return; }
  if (t.id === 'playerFilter') { playerFilter = t.value; renderPlayers(); return; }
  if (!t.closest('#matchForm')) return;
  var f = t.dataset.f, row = t.closest('.row'), i = row ? +row.dataset.i : -1;
  if (f === 'group') { draft.group = t.value; draft.home = ''; draft.away = ''; renderForm(); }
  else if (f === 'home') { draft.home = t.value; if (draft.away === draft.home) draft.away = ''; renderForm(); }
  else if (f === 'away') { draft.away = t.value; if (draft.home === draft.away) draft.home = ''; renderForm(); }
  else if (f === 'goal-og') { draft.goals[i].og = t.checked; renderForm(); }
  else if (f === 'stat-side') { draft.stats[i].side = t.value; renderForm(); }
});
$$('.tab').forEach(function(b){ b.addEventListener('click', function(){ setTab(b.dataset.tab); }); });
 
/* ---------- sample data ---------- */
function sampleState(){
  var s = defaultState(); s.title = 'Sample cup';
  var A = s.groups[0], B = s.groups[1], a = A.teams.map(function(t){ return t.id; }), b = B.teams.map(function(t){ return t.id; });
  var goal = function(side, player, n, og){ return { side: side, player: player, n: n || 1, og: !!og }; };
  var st = function(side, player, saves, tackles){ return { side: side, player: player, saves: saves || 0, tackles: tackles || 0 }; };
  var k = 0, now = Date.now();
  var mk = function(g, h, aw, goals, stats){ return { id: uid(), group: g.id, home: h, away: aw, goals: goals, stats: stats || [], ts: now + (k++) }; };
  s.matches = [
    mk(A, a[0], a[1], [goal('away', 'Vikram')], [st('home', 'Rohan', 3, 4), st('away', 'Sameer', 5, 6)]),
    mk(A, a[0], a[2], [goal('home', 'Arjun', 2), goal('home', 'Neel')], [st('home', 'Rohan', 2, 3), st('away', 'Imran', 7, 2)]),
    mk(A, a[0], a[3], [goal('home', 'Arjun'), goal('home', 'Karan'), goal('away', 'Zaid')], [st('away', 'Faiz', 4, 3)]),
    mk(A, a[1], a[2], [goal('home', 'Vikram', 2), goal('home', 'Ishaan')], [st('home', 'Sameer', 1, 2), st('away', 'Imran', 9, 1)]),
    mk(A, a[1], a[3], [goal('home', 'Vikram'), goal('away', 'Zaid'), goal('away', 'Yusuf')], [st('home', 'Sameer', 4, 3), st('away', 'Faiz', 3, 5)]),
    mk(A, a[2], a[3], [goal('home', 'Tarun'), goal('away', 'Zaid')], [st('home', 'Imran', 6, 2), st('away', 'Faiz', 5, 2)]),
    mk(B, b[0], b[1], [goal('home', 'Aman', 2)], [st('home', 'Dhruv', 2, 3)]),
    mk(B, b[2], b[3], [goal('home', 'Pranav'), goal('away', 'Lakshay')], [st('away', 'Hemant', 3, 1)]),
    mk(B, b[0], b[2], [goal('home', 'Aman'), goal('away', 'Pranav')], [st('away', 'Kabir', 4, 2)]),
    mk(B, b[1], b[3], [goal('home', 'Nikhil'), goal('away', 'Lakshay')], [st('home', 'Omkar', 5, 4)])
  ];
  return s;
}
 
/* ---------- init ---------- */
$('#title').value = state.title;
setTab('standings');
try {
  if (window.claude && window.claude.use) {
    window.claude.use('downloads').then(function(api){
      downloadsApi = api || null;
      var btn = $('#btnDownload'); if (btn && downloadsApi) btn.hidden = false;
    }).catch(function(){});
  }
} catch (e) {}
})();
</script>
